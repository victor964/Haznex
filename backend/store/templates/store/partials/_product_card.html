{% load store_tags %}
<a href="{% url 'store:product_detail' slug=product.slug %}" class="card-product group block">
  <div class="aspect-square overflow-hidden bg-haznex-bg">
    {% with img=product.primary_image %}
    {% if img %}
    <img src="{{ img.image.url }}" alt="{{ img.alt_text|default:product.name }}" class="h-full w-full object-cover transition group-hover:scale-105">
    {% else %}
    <div class="flex h-full items-center justify-center text-haznex-muted text-sm">No image</div>
    {% endif %}
    {% endwith %}
  </div>
  <div class="p-4">
    <div class="mb-2 flex flex-wrap gap-2">
      <span class="{{ product.condition|condition_badge_class }}">{{ product.get_condition_display }}</span>
      <span class="badge-source">{{ product.source_type|source_label }}</span>
    </div>
    <h3 class="font-semibold text-haznex-text line-clamp-2">{{ product.name }}</h3>
    <p class="mt-1 text-sm text-haznex-muted">{{ product.location }}</p>
    <p class="mt-3 text-lg font-bold text-gold-dark">{{ product.final_client_price|kes }}</p>
  </div>
</a>
