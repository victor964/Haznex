<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block email_title %}Haznex Order Update{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background-color:#f5f3ee;font-family:Inter,'Segoe UI',Arial,sans-serif;color:#1a1a1a;">
  <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="background-color:#f5f3ee;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="max-width:600px;background-color:#ffffff;border:1px solid #e8e4da;border-radius:8px;overflow:hidden;">
          <tr>
            <td style="background-color:#c9a227;padding:20px 24px;">
              <p style="margin:0;font-size:22px;font-weight:700;color:#ffffff;letter-spacing:0.02em;">Haznex</p>
              <p style="margin:6px 0 0;font-size:13px;color:#fff8e7;">Bridging UK Markets to Kenya</p>
            </td>
          </tr>
          <tr>
            <td style="padding:28px 24px;">
              {% block email_body %}{% endblock %}
              <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="margin-top:24px;background-color:#faf9f6;border:1px solid #e8e4da;border-radius:6px;">
                <tr>
                  <td style="padding:16px;">
                    <p style="margin:0 0 8px;font-size:12px;color:#6b6b6b;text-transform:uppercase;letter-spacing:0.04em;">Order details</p>
                    <p style="margin:0 0 4px;font-size:14px;"><strong style="color:#1a1a1a;">Order:</strong> {{ order_number }}</p>
                    <p style="margin:0 0 4px;font-size:14px;"><strong style="color:#1a1a1a;">Product:</strong> {{ product_name }}</p>
                    <p style="margin:0;font-size:14px;"><strong style="color:#1a1a1a;">Status:</strong> {{ status_display }}</p>
                  </td>
                </tr>
              </table>
              {% if admin_note %}
              <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="margin-top:16px;border-left:4px solid #c9a227;">
                <tr>
                  <td style="padding:8px 0 8px 16px;">
                    <p style="margin:0;font-size:13px;color:#6b6b6b;font-style:italic;">{{ admin_note }}</p>
                  </td>
                </tr>
              </table>
              {% endif %}
              <table role="presentation" cellpadding="0" cellspacing="0" style="margin-top:28px;">
                <tr>
                  <td style="border-radius:6px;background-color:#c9a227;">
                    <a href="{{ tracking_url }}" style="display:inline-block;padding:12px 24px;font-size:14px;font-weight:600;color:#ffffff;text-decoration:none;">Track your order</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 24px;background-color:#faf9f6;border-top:1px solid #e8e4da;">
              <p style="margin:0;font-size:12px;color:#6b6b6b;text-align:center;">{{ footer_tagline }}</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
