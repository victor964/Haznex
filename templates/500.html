<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Something Went Wrong | Haznex</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #f8f7f4;
      color: #1a1a1a;
      padding: 1.5rem;
    }
    .card {
      max-width: 28rem;
      text-align: center;
      background: #fff;
      border: 1px solid #e8e4da;
      border-top: 4px solid #c9a227;
      border-radius: 0.75rem;
      padding: 2rem;
    }
    h1 { margin: 0.5rem 0 0; font-size: 1.5rem; }
    p { color: #6b6b6b; line-height: 1.6; }
    .code { font-size: 3rem; font-weight: 700; color: #a68521; }
    a {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.75rem 1.5rem;
      background: #c9a227;
      color: #fff;
      text-decoration: none;
      border-radius: 0.5rem;
      font-weight: 600;
    }
    a:hover { background: #a68521; }
  </style>
</head>
<body>
  <div class="card">
    <p class="code">500</p>
    <h1>Something went wrong on our end</h1>
    <p>Please try again shortly. If the problem continues, contact us at hello@haznex.co.ke.</p>
    <a href="/">Back to Homepage</a>
  </div>
</body>
</html>
